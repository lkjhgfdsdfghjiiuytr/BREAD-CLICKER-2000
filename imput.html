<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🍞 Welcome to BREAD CLICKER 2000!! 🍞</title>
    <style>
        /* 2000s Retro Web Aesthetic */
        body {
            background-color: #008080; 
            font-family: "Times New Roman", Times, serif;
            color: #000000;
            margin: 20px;
            text-align: center;
        }

        #marquee-container {
            background-color: #ff00ff;
            color: #ffffff;
            font-weight: bold;
            padding: 5px;
            border: 3px outset #ff00ff;
            margin-bottom: 20px;
        }

        #main-window {
            background-color: #c0c0c0; 
            border: 4px outset #ffffff;
            width: 450px;
            margin: 0 auto;
            padding: 15px;
            box-shadow: 5px 5px 0px #000000;
        }

        #window-title {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px;
            font-weight: bold;
            text-align: left;
            margin-top: -15px;
            margin-left: -15px;
            margin-right: -15px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        h1 {
            color: #0000ff;
            text-shadow: 2px 2px #ffff00;
            font-size: 28px;
            margin: 10px 0;
        }

        .stats-box {
            background-color: #ffffff;
            border: 3px inset #808080;
            padding: 10px;
            margin: 15px 0;
            font-family: "Courier New", Courier, monospace;
            font-size: 18px;
            font-weight: bold;
        }

        /* Just the Bread Emoji Button */
        #bread-btn {
            background: none;
            border: none;
            font-size: 100px;
            cursor: pointer;
            outline: none;
            user-select: none;
            transition: transform 0.05s;
            display: inline-block;
            margin: 15px 0;
        }

        #bread-btn:active {
            transform: scale(0.9);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
        }

        .counter {
            background-color: black;
            color: #00ff00;
            padding: 2px 6px;
            font-family: monospace;
            border: 1px solid #808080;
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% { background-color: #ff0000; filter: invert(1); }
            20% { background-color: #00ff00; }
            40% { background-color: #0000ff; }
            60% { background-color: #ffff00; }
            80% { background-color: #ff00ff; filter: invert(0); }
            100% { background-color: #00ffff; }
        }

        .bugging-out {
            animation: glitch 0.1s infinite !important;
        }

        /* Black screen container hidden by default */
        #black-screen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Video box inside the black screen */
        .video-box {
            width: 640px;
            max-width: 90%;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="marquee-container">
            <marquee scrollamount="5">!!! WELCOME TO THE ULTIMATE BREAD CLICKER HOMEPAGE !!! HEY HO LET'S GO !!!</marquee>
        </div>

        <div id="main-window">
            <div id="window-title">🥪 BreadClickerV4.0.exe</div>
            
            <h1>LETS GET THIS BREAD!</h1>
            <p><i>Goal: Reach 12 Slices to Win!</i></p>
            
            <div class="stats-box">
                Clicks: <span id="click-count">0</span> / 10<br>
                Slices: <span id="slice-count">0</span> / 12
            </div>

            <button id="bread-btn" onclick="clickBread()">🍞</button>
        </div>

        <footer>
            <p>Best viewed in Netscape Navigator at 800x600 resolution</p>
            <p>YOU ARE VISITOR NUMBER: <span class="counter">00042069</span></p>
            <p><img src="https://web.archive.org/web/20090830050553im_/http://geocities.com/Hollywood/Hills/2234/ie_animated.gif" alt="IE logo" width="88" height="31"> <img src="https://web.archive.org/web/20091027082349im_/http://geocities.com/SiliconValley/Way/1400/notepad.gif" alt="Made with Notepad" width="88" height="31"></p>
        </footer>
    </div>

    <div id="black-screen-overlay">
        <div class="video-box">
            <iframe id="endgame-video" width="100%" height="360" src="https://youtu.be/FLKjmmnbm9oenablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        let clicks = 0;
        let slices = 0;
        const targetSlices = 12;
        let isGlitching = false;

        function clickBread() {
            if (slices >= targetSlices || isGlitching) return; 

            clicks++;

            if (clicks >= 10) {
                clicks = 0; 
                slices++;   
            }

            document.getElementById("click-count").innerText = clicks;
            document.getElementById("slice-count").innerText = slices;

            if (slices >= targetSlices) {
                triggerBugOut();
            }
        }

        function triggerBugOut() {
            isGlitching = true;
            
            // Trigger crazy screen flashing
            document.body.classList.add("bugging-out");

            // After 2 seconds, remove game elements and show black screen with YouTube video
            setTimeout(function() {
                document.body.classList.remove("bugging-out");
                
                // Hide normal game layout
                document.getElementById("game-wrapper").style.display = "none";
                
                // Show black screen layout
                const overlay = document.getElementById("black-screen-overlay");
                overlay.style.display = "flex";
                
                // Forces autoplay for the YouTube video
                const iframe = document.getElementById("endgame-video");
                iframe.src += "&autoplay=1";

            }, 2000);
        }
    </script>

</body>
</html>
